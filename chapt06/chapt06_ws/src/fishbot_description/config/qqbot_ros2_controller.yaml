controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    qqbot_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    qqbot_effort_controllers:
      type: effort_controllers/JointGroupEffortController
    qqbot_diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
      
qqbot_effort_controllers:
  ros__parameters:
    joints:
      - wheel_left_joint
      - wheel_right_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
      - effort

qqbot_diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - wheel_left_joint
    right_wheel_names:
      - wheel_right_joint
    wheel_separation: 0.20
    wheel_radius: 0.032

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    cmd_vel_timeout: 0.5
    publish_rate: 50.0
    use_stamped_vel: false

    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]

    open_loop: true
    enable_odom_tf: true
    